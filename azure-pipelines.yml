trigger:
  - master

pool:
  vmImage: 'windows-2022'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  proyecto: '**/ApparelApi.csproj'

stages:

# ==========================================
# 1. ETAPA DE COMPILACIÓN Y PUBLICACIÓN
# ==========================================
- stage: Build
  displayName: 'Compilación y publicación'

  jobs:
  - job: BuildJob
    displayName: 'Compilar API'

    steps:

    # Instalar el SDK de .NET
    - task: UseDotNet@2
      displayName: 'Instalar SDK de .NET'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    # Verificar que se encuentren los proyectos
    - powershell: |
        Write-Host "Buscando archivos de proyecto .NET..."

        $projects = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Filter "*.csproj" -Recurse

        if ($projects.Count -eq 0) {
          Write-Error "No se encontraron archivos .csproj en el repositorio."
          exit 1
        }

        Write-Host "Proyectos encontrados:"
        $projects | ForEach-Object {
          Write-Host $_.FullName
        }
      displayName: 'Verificar proyectos .NET'

    # Restaurar dependencias
    - task: DotNetCoreCLI@2
      displayName: 'Restaurar dependencias'
      inputs:
        command: 'restore'
        projects: '$(proyecto)'

    # Compilar proyectos
    - task: DotNetCoreCLI@2
      displayName: 'Compilar proyectos'
      inputs:
        command: 'build'
        projects: '$(proyecto)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    # Publicar la API web
    - task: DotNetCoreCLI@2
      displayName: 'Publicar API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(proyecto)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # Publicar el artefacto
    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefacto'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# ==========================================
# 2. ETAPA DE DESPLIEGUE A AZURE
# ==========================================
- stage: Deploy
  displayName: 'Despliegue a Azure App Service'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployJob
    displayName: 'Desplegar API'

    steps:

    # Descargar el artefacto generado
    - task: DownloadBuildArtifacts@0
      displayName: 'Descargar artefacto'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Comprobar que existe el paquete ZIP
    - powershell: |
        $packages = Get-ChildItem -Path "$(System.ArtifactsDirectory)/drop" -Filter "*.zip" -Recurse

        if ($packages.Count -eq 0) {
          Write-Error "No se encontró ningún archivo ZIP para desplegar."
          exit 1
        }

        Write-Host "Paquetes encontrados:"
        $packages | ForEach-Object {
          Write-Host $_.FullName
        }
      displayName: 'Verificar paquete de despliegue'

    # Desplegar en Azure App Service
    - task: AzureWebApp@1
      displayName: 'Desplegar API en Azure'
      inputs:
        azureSubscription: 'ApiWebapp'
        appType: 'webApp'
        appName: 'ApparelApi20261031121250'
        package: '$(System.ArtifactsDirectory)/drop/*.zip'
        deploymentMethod: 'zipDeploy'
